<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加载 UMD 组件库测试</title>

  <!-- 1. 引入图标库（如果组件内部使用 Font Awesome） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 2. 引入由宿主提供的外部依赖 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"></script>

  <!-- 3. 模拟宿主提供的 Kivii Bridge -->
  <script>
    window.kivii = {
      ready: () => console.log('Kivii Bridge Mock Ready')
    };
  </script>

  <!-- 4. 引入 project.config.js 中 fileName 对应的 UMD 产物 -->
  <script src="./dist/vue-component-test.umd.js"></script>

  <style>
    :root {
      --color-primary: #4e628f;
      --color-primary-hover: #354265;
      --color-primary-light: #a3b6de;
      --color-primary-dark: #2a3451;
      --color-primary-bg: rgba(78, 98, 143, 0.1);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .host-container {
      max-width: 56rem;
      margin: 40px auto;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div id="app" class="host-container">
    <h2 style="color: #333; margin-bottom: 24px;">在独立 HTML 中加载 UMD 组件库</h2>

    <umd-integration-test
      :theme="currentTheme"
      @toggle-theme="onToggleTheme"
    ></umd-integration-test>
  </div>

  <script>
    const { createApp, ref } = Vue;
    // 故意与实际的 window.vueComponent3 不一致，用于验证全局变量不匹配时的处理。
    const ComponentLibrary = window.vueComponent;

    const app = createApp({
      setup () {
        const currentTheme = ref('light');

        const onToggleTheme = () => {
          currentTheme.value = currentTheme.value === 'light' ? 'dark' : 'light';

          if (currentTheme.value === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.style.backgroundColor = '#111827';
          } else {
            document.documentElement.classList.remove('dark');
            document.body.style.backgroundColor = '#f3f4f6';
          }
        };

        return {
          currentTheme,
          onToggleTheme
        };
      }
    });

    if (ComponentLibrary) {
      console.log('成功加载 UMD 组件库:', ComponentLibrary);

      if (typeof ComponentLibrary.install === 'function') {
        app.use(ComponentLibrary);
      } else {
        Object.keys(ComponentLibrary).forEach(key => {
          if (typeof ComponentLibrary[key] === 'object' && ComponentLibrary[key].setup) {
            const kebabName = key.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            app.component(kebabName, ComponentLibrary[key]);
            app.component(key, ComponentLibrary[key]);
          }
        });
      }
    } else {
      console.error('未找到 window.vueComponent，请确认全局变量配置和 UMD 文件是否正确加载。');
    }

    app.mount('#app');
  </script>
</body>

</html>
